name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      EMBEDDING_BACKEND: hashing   # no model download in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # faiss-cpu is small and exercises the FAISS code path; fastembed (model download) is skipped.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt faiss-cpu

      - name: Lint
        run: ruff check .

      - name: Tests (LLM calls are mocked; no API key needed)
        run: pytest -v

  offline-eval:
    # LLM-free numbers on every push: kNN baseline on both datasets and the duplicate-detection sweep.
    runs-on: ubuntu-latest
    needs: test
    env:
      EMBEDDING_BACKEND: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python evaluate.py classify --dataset synthetic --mode baseline
          python evaluate.py classify --dataset public --mode baseline
          python evaluate.py duplicates
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results/
