<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="stamp-mark" viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="26" />
        <circle cx="30" cy="30" r="21" />
        <text x="30" y="35" text-anchor="middle">ST</text>
      </svg>
      <div class="brand-text">
        <h1>Support triage</h1>
        <p>Partner support case ledger</p>
      </div>
    </div>
    <div class="model-plate" id="modelPlate">
      <span id="modelLabel">Checking model&hellip;</span>
    </div>
  </header>

  <div class="layout">
    <aside class="rail">
      <button type="button" class="primary rail-new" id="newCaseBtn">New case</button>

      <nav class="tabs" id="statusTabs">
        <button class="tab active" data-status="">All cases</button>
        <button class="tab" data-status="open">Open</button>
        <button class="tab" data-status="in_progress">In progress</button>
        <button class="tab" data-status="closed">Closed</button>
      </nav>

      <div class="rail-section">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter">
          <option value="">All categories</option>
        </select>
      </div>

      <div class="rail-section rail-count">
        <span id="ticketCount">0</span> cases on file
      </div>
    </aside>

    <main class="ledger">
      <section class="ask-block">
        <form id="askForm" class="ask-form">
          <label for="askInput">Ask about your cases</label>
          <div class="ask-row">
            <input type="text" id="askInput" maxlength="500" placeholder="e.g. Which open cases are high priority?" autocomplete="off" />
            <button type="submit" class="primary">Ask</button>
          </div>
        </form>
        <div id="askAnswer" class="ask-answer" hidden></div>
      </section>

      <table>
        <thead>
          <tr>
            <th>Case</th>
            <th>Subject</th>
            <th>Sender</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Received</th>
          </tr>
        </thead>
        <tbody id="ticketRows"></tbody>
      </table>
      <p class="empty" id="emptyState" hidden>No cases match this filter. Try All cases or another category.</p>
    </main>

    <aside class="case-panel">
      <div class="case-panel-inner" id="casePanelInner">
        <p class="case-placeholder">Select a case on the left to open its file, or file a new one to watch the triage run.</p>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
